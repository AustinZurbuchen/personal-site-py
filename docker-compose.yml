services:
  personal-site-py:
    build:
      context: .
      dockerfile: Dockerfile
    # The frontend's nginx proxies /api/ to http://personal-site-py:5000/,
    # so this name is load-bearing — changing it breaks the site.
    container_name: personal-site-py

    # Secrets come from .env on the host at container start. They are no
    # longer copied into the image (see .dockerignore), so this file must
    # exist next to this compose file or the container starts without
    # DBUSER/DBPASS/ADMIN_TOKEN. See .env.example for the required keys.
    env_file:
      - .env

    # Not published to the host: only the frontend's nginx needs to reach
    # this, over the shared Docker network.
    expose:
      - "5000"

    restart: unless-stopped

# The frontend and this service share the `zurbnet` network so nginx can
# resolve the hostname `personal-site-py`. Declared external because the
# network is created and owned outside these compose files — compose will
# not create it, and `docker compose up` fails fast if it is missing rather
# than silently attaching to a private network nginx cannot reach.
#
#   docker network create zurbnet   # if it ever needs recreating
networks:
  default:
    name: zurbnet
    external: true
